<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dirty baby二創小遊戲</title>
<meta name="description" content="Dirty Baby 二創小遊戲！看看寶寶想要什麼，記住順序準時答對，考驗你的記憶力～">
<meta property="og:title" content="Dirty baby二創小遊戲">
<meta property="og:description" content="Dirty Baby 二創小遊戲！看看寶寶想要什麼，記住順序準時答對，考驗你的記憶力～">
<meta property="og:type" content="website">
<meta property="og:url" content="https://linomo.github.io/dirty-baby-game/">
<meta property="og:image" content="https://linomo.github.io/dirty-baby-game/assets/baby/baby-idle.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="stage" id="stage">
    <!-- 開場擋板：直接寫死在 HTML 裡，瀏覽器第一時間就畫出來，不用等 JS 跑完才出現 -->
    <div class="splash-overlay" id="splash">
      <svg class="splash-svg" viewBox="0 0 360 450" preserveAspectRatio="xMidYMid slice">
        <mask id="splashCutout">
          <rect width="100%" height="100%" fill="#fff"></rect>
          <text x="50%" y="39%" text-anchor="middle" dominant-baseline="middle" class="splash-title-text">Dirty Baby</text>
        </mask>
        <rect width="100%" height="100%" fill="#BF878C" mask="url(#splashCutout)"></rect>
        <text x="50%" y="49%" text-anchor="middle" dominant-baseline="middle" class="splash-subtitle-text">二創小遊戲</text>
      </svg>
      <!-- 實心按鈕，樣式跟失敗結局的「重來一次」一樣；點下去同時也會解鎖背景音樂的自動播放限制 -->
      <button type="button" class="splash-start-btn" id="splashStartBtn">開始照顧寶寶</button>
    </div>

    <!-- 看階段的半透明黃色蒙版：直接寫死在 HTML 裡，一開始就跟寶寶圖/序列格子一起出現 -->
    <div class="reveal-mask" id="revealMask"></div>

    <div class="status-bar">
      <span class="hint" id="hint">看看寶寶想要什麼？</span>
      <span class="timer" id="timer">--</span>
    </div>

    <div class="sequence-row" id="seqRow"></div>

    <div class="baby-stage" id="babyStage">
      <img class="bg-poster bg-poster-left" src="assets/background/post01.png" alt="">
      <img class="bg-poster bg-poster-right" src="assets/background/post02.png" alt="">
      <div class="deco-icon deco-tl" data-id="bottle"></div>
      <div class="deco-icon deco-tr" data-id="camera"></div>
      <img id="babyImg" src="assets/baby/baby-idle.png" alt="baby">
      <div class="deco-icon deco-bl" data-id="poop"></div>
      <div class="deco-icon deco-br" data-id="cat"></div>
    </div>

    <div class="button-row">
      <button class="vbtn c-look" data-dir="look">看</button>
      <button class="vbtn c-kiss" data-dir="kiss">親</button>
      <button class="vbtn c-hug" data-dir="hug">抱</button>
      <button class="vbtn c-pat" data-dir="pat">拍</button>
      <button class="vbtn c-me" data-dir="me">我</button>
    </div>
  </div>

  <!-- type="module" 才能用 import/export，本機測試務必用 Live Server 開，不能直接雙擊開檔案 -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
